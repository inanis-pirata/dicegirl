# Built-in non-rule data pack: random names.
#
# This file is a *data pack*, not a rulebook: it carries lookup content that
# belongs to no game (names are not CoC rules). Game rules live exclusively
# in the rulebooks; data packs use the same random-table schema.
#
# A name set composes one name from table rolls: every part rolls its table
# once and the row texts are concatenated in order.
schema_version: "1"
id: "names"
name: "随机姓名数据包"
description: "中文 / 日文 / 英文随机姓名（数据，非规则）"

